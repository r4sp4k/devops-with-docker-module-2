<!DOCTYPE html>
<html>
<body>
  <h1>Click the button</h1>
  <button onclick="fetch('/click', {method:'POST'}).then(r=>r.json()).then(d=>{document.getElementById('c').textContent=d.clicks})">
    Click me
  </button>
  <p>Total clicks saved in database: <span id="c">{{ clicks }}</span></p>
</body>
</html>
