services:
  frontend:
    image: raspak/frontend
    ports:
      - 5001:5001    
    container_name: frontend    
  backend:
    image: raspak/backend
    ports:
      - 8080:8080   
    environment:
      - REDIS_HOST=redis
    container_name: backend
  redis:    
    image: redis:alpine
    container_name: redis