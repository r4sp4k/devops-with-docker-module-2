services:
  frontend:
    image: raspak/frontend:v2.10
    #expose:
    #  - "5001"
    #ports:
    #  - 5001:5001    
    container_name: frontend    
  backend:
    image: raspak/backend
    #expose:
    #  - "8080"
    #ports:
    #  - 8080:8080   
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - REQUEST_ORIGIN=http://localhost:8000
    depends_on:
      - db
    container_name: backend
  redis:    
    image: redis:alpine
    container_name: redis
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
    container_name: db_backend
    volumes:
      - ./database:/var/lib/postgresql  
  nginx:
    image: nginx
    ports:
    - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
    - backend  