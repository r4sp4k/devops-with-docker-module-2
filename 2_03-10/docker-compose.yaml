services:
  frontend:
    image: raspak/frontend
    ports:
      - 5001:5001    
    container_name: frontend    
  backend:
    image: raspak/backend
    ports:
      - 8080:8080   
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
    depends_on:
      - db
    container_name: backend
  redis:    
    image: redis:alpine
    container_name: redis
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
    container_name: db_backend  
